nav{display:flex;background:#fbf1da;border-top:1px solid #e0cfa6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0;font-size:10.5px;color:#8b7650;font-family:inherit}
nav button i{display:block;font-style:normal;font-size:21px}nav button.on{color:var(--g);font-weight:700}
.card{background:rgba(255,250,240,.94);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid #e0cfa6}
.hero{background:linear-gradient(135deg,#8a5a2b,#c28b3c);color:#fff;border:0}
.hero small{opacity:.9}.hero h2{margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--c);border-radius:18px;padding:16px 8px;text-align:center;border:1px solid #e0cfa6;font-family:inherit;font-size:14px;color:var(--t)}
.tile:active{transform:scale(.96);background:#f1e0b8}
.tile i{display:block;font-style:normal;font-size:30px;margin-bottom:4px}
h3{margin:4px 0 10px;color:var(--cy)}
input,textarea,select{width:100%;padding:11px;border:1px solid #d8c391;border-radius:12px;font-size:16px;font-family:inherit;margin-bottom:8px;background:#fffdf7;color:var(--t)}
.btn{background:linear-gradient(120deg,#8a5a2b,#c28b3c);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-family:inherit}
.btn.g{background:var(--g);color:#fff}.btn.s{padding:6px 10px;font-size:13px}
.row{display:flex;align-items:center;gap:8px}.row>*{flex:0 0 auto}.row .f{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{border:1px solid var(--cy);color:var(--cy);background:none;border-radius:20px;padding:5px 12px;font-size:13px;white-space:nowrap;font-family:inherit}
.chip.on{background:var(--cy);color:#fff}
.item{background:var(--c);border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid #e0cfa6}
.item small{color:#7d6a48;display:block}
.txt{line-height:2;font-size:18px;white-space:pre-wrap}
.resp{color:var(--g);font-weight:700}
.tag{font-size:11px;background:#e0cfa6;color:var(--cy);border-radius:8px;padding:2px 7px}
.note{font-size:12px;color:#8b7650;text-align:center;margin:10px 0}
.hdrc{background:linear-gradient(135deg,#8a5a2b,#c28b3c);color:#fff;border-radius:0 0 26px 26px;margin:-14px -14px 14px;padding:18px 18px 22px}
.hdrc h1{margin:2px 0;font-size:30px}.hdrc small{opacity:.9}
.chipw{display:inline-block;background:#ffffff30;border-radius:20px;padding:4px 12px;font-size:13px;margin-top:8px}
.seg{display:flex;background:var(--c);border-radius:14px;padding:4px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;color:#7d6a48;padding:10px;border-radius:11px;font-family:inherit;font-size:15px}.seg button.on{background:var(--g);color:#fffaf0;font-weight:700}
.bk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.bk div{background:var(--c);border:1px solid #e0cfa6;border-radius:14px;padding:12px 4px;text-align:center;font-size:14px}.bk small{display:block;color:#7d6a48;font-size:11px}
.bar{height:8px;background:#e0cfa6;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pk))}
.sec{color:var(--g);margin:14px 0 8px;font-weight:700}
.ico{width:44px;height:44px;border-radius:12px;background:#e0cfa6;display:flex;align-items:center;justify-content:center;font-size:22px}

function copt(d){const y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();const a=Math.floor((14-m)/12),Y=y+4800-a,M=m+12*a-3;const jd=dd+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045;const n=jd-1825030;const yr=Math.floor((4*n+3)/1461);const doy=n-Math.floor((1461*yr)/4);return {y:yr+1,m:Math.floor(doy/30),d:doy%30+1}}

ووقتي نساني\nجماله فتان وقلبه حنان\nمحضرهٌ ملآن بالجودِ والإحسان\nشوقي يا رب إليك إليك وليس سواك\nأكون ملكًا ليك فمبتغاي رضاك"},{n:"من غير حدود حبيتني تحت جناحك خبيتني",c:"ترانيم الاجتماع",bpm:0,t:"القرار - من غير حدود حبيتني تحت جناحك خبيتني\nبدماك الغالية فديتني ولقيت الحب معاك\n\n1- ليك أشكي كل همومي وكل متاعب يومي\nوتسافر كل غيومي وألاقي الراحة معاك\n\n2- في كنيستك قلبي ارتاح وإيديك داوت الجراح\nفي زرعت الأفراح ولقيت البركة معاك\n\n3- أنا قلبي في حبك عاش وكتير دور مالقاش\nأبداً يا يسوع مانساش كل آلامك وفداك"},{n:"علمني أنتظرك يا رب",c:"ترانيم الاجتماع",bpm:0,t:"1- علمني أنتظرك يا رب عرفني رؤيتك للدرب\nفليس لي سواك أنت سندي و روحك يقودني\nوكلامك سراجي\n\n2- لذذني بحبك الغني و قدني بنورك السني\nفحبك أعظم طوق للنجاة نبع رجائي في الصلاة\nكل أمالي في الحياة\n\n3- يا ربي أنر لَّى عيني يا ربي أفتح لي قلبي\nلكي أري ذراعك تحيط بي و صدرك يضمني\nو شخصك يعتني بي"},{n:"سامحنا يا فادينا",c:"ترانيم الاجتماع",bpm:0,t:"ق: سامحنا يا فادينا باركنا يا يسوع\nعيوننا بتترجاك مليانة بالدموع\n\n+ أنت إلهنا الحي أنت اللي قريب جاى\nحاتيجى وتعزينا وتمسح الدموع\n\n+ دايمًا نتعدى عليك والعالم يغرينا\nقوينا قوينا من فضلك يا يسوع\n\n+ تغاضى عن خطايانا عظم لطفك ويانا\nوضع يدك علينا وبارك الجموع\n\n+ نوصيك بعمل ايديك خدامك والسامعين\nخطاه ومؤمنين إوردهم للينبوع\n\n+ ولا حاجة نستاهلها من اللي بتديها لنا\nدى محبتك غمرتنا نسجد لك في خشوع\n\n+على القلوب بتقرع وطوبى للي يسمع\nويتوب توبة من قلبه توبة من غير رجوع"},{n:"صممت أذناي",c:"ترانيم الاجتماع",bpm:0,t:"1- صممت أذناي لم أسمع صوتك لي يناديني\nلكن بعيدا أطلقتها لسمع الشر يغويني\n\nالقرار\nبين يديك يا ربي حياتي أنت تراها بعين الحنان\nلا تنظر لي كخطاياي بل بالرحمة طول الزمان\n\n2- أغمضت عيناي لم أري يديك مفتوحة تدعيني\nلكن بعيدًا أطلقتها لنظر الشر يغويني\n\n3- أمسكت شفتاي لم أنطق أدعوك حتي تأتيني\nلكن بعيدًا أطلقتها لقول الشر يغويني\n\n4- أبعدت يداي لم أمسك يمينك حتي تهديني\nلكن بعيدًا أطلقتها لفعل الشر يغويني\n\n5- حواسي وكل أفكاري وكل ما تعطيني\nبعيدًا عنك أطلقتها تركت الشر يغويني"},{n:"مين أحن منك",c:"ترانيم الاجتماع",bpm:0,t:"القرار - مين أحن منك التجئ إليه\nوفي كل ضيقي وتعبي أتكل عليه\n\n1- يا قاضي الأرامل يا أبو الأيتام\nحلال المشاكل صانع السلام\n\n2- الأشبال احتاجت والأسود بتجوع\nأما المؤمنين أشبعهم يسوع\n\n3- إن طلبت غيرك انتظاري يطول\nلكن إن دعيتك بتجيني على طول"},{n:"أنا ماشى ونورك قدامى",c:"ترانيم الاجتماع",bpm:0,t:"انا ماشي ونورك قدامي .. وكلامك نوري في ايامي\nابليس ان كان يتحداني : راح ادوسه بدم اللي فداني\n\nق: انا ماشي وحبك لي منار .. وصليبك عداني من النار\nانا ماشي ما دام انت معايا .. والهدف اهو واضح جوايا\nفي طريقي براجع خطواتي .. وبتابع صوتك في حياتي\nانا ماشي ودايس على المي .. وصليبك فوقي صبح علمي\nفي طريقي انا لازم اتالم .. اوهبني الامك اتعلم\nانا ماشي وصوتك عزاني .. من روحك يا يسوع املاني\nتسبيحك يعلى ف مشواري .. وهتافك يحلى لي في داري"},{n:"ما أحلى ساعة الصلاة",c:"ترانيم الاجتماع",bpm:0,t:"القرار - ما أحلى ساعة الصلاة لما أقف قدام الله\nلا أشعر بأحد سواه ما أحلى ساعة الصلاة\n\n1- فيها القلب بيتكلم فيها حياتي بتتسلم\nفيها روحي بتقدم ما أحلى ساعة الصلاة\n\n2- فيها فرح وفيها دموع فيها حرارة وفيها خشوع\nفيها توبة وفيها رجوع ما أحلى ساعة الصلاة"},{n:"ما عندي شئ أقدم لك",c:"ترانيم الاجتماع",bpm:0,t:"+ ماعندي شئ أقدم لك غير حياتي\nأغلى ما عندي اقدم لك عمري و حياتي\n\nق: من غيرك عمرى ضياع فى ضياع\nمن غير قلبى حياتى نزاع\nأنت الأمل اللى ماعمره ضاع\nأنت ياحبيب قلبى ياغالى\n\n+ أسمى على كفك نقشته بالدم الغالي\nوكنت عبد ورفعته للمحب العالي\n\n+وبقيت ربى أنت فرحي ونبع سلامي\nومعاك حياتى ليها هدف ومعنى سامي"},{n:"كل يوم تحت صليبك",c:"ترانيم الاجتماع",bpm:0,t:"+ كل يوم تحت صليبك كنت بافكر دايماً فيك ياربي وأجيلك\nمن غير خوف زي أبويا عن أسراري وعن حكايتني هناك باحكيلك\nكنت كتير يا ربي بافكر من دلوقتي وحتى أما أكبر\nإني لا يمكن يوم هاتغير وأنسى صليبك\nكنت في قلبي دايماً أصلي يفضل حبك في تملي\nومافيش حاجة في يوم تمنعني إن أجيلك وافضل أحكيلك\n\n+ وأما كبر ناديتك تاني بس لقيت في إيدي ياربي قيود منعاني\nحزن وخوف مالي كياني سجن خطية وحب وشهوة عالم فاني\nوبقيت تاني يارب بافكر امتى أرجع لك وازاي هاقدر\nأقعد زي ما كنت صغير تحت صليبك\nوبقيت تاني في قلبي باصلي إن تغفر لي وتخلي شهوة قلبي وروحي تملي\nإني أجيلك وافضل أحكيلك\n\n+ وأما رجعت لقيتك حاني بين احضان الآب في الروح فرح يملاني\nمسحت دموعي جددت كياني باعترافات من عمق القلب ندم جواني\nوإزاي بقى يا رب هاكافئك وعلى رعايتك\nهافضل طول الوقت أطاوعك جوه طريقك\nويكون قلبي بيرنم لك طول العمر هامجد اسمك\nأغلي ما عنده بيقدملك لما أجيلك"},{n:"بالدموع يارب كلمتك",c:"ترانيم الاجتماع",bpm:0,t:"1- بالدموع يارب كلمتك بالدموع يارب أنا عاهدتك\n\nالقرار يا يسوع أنا عاهدتك\n\n2- عيناى بالدموع قد امتلآت نفسى من الأوجاع قد انسكبت\n\n3- بالخطايا يارب عاملتك بالخطية يارب انا سلمتك\n\n4- يا من قبلت الموت من أجلى ها عيناى خذها وكذا قلبى"},{n:"مبتنساش أبدًا يا ربي",c:"ترانيم الاجتماع",bpm:0,t:"مبتنساش أبدًا يا ربي إللي إتكاله عليك\nولا تنساش أبدًا يا ربي إللي بيمسك فيك\n\nالقرار:\nلو نسيت الأم رضيعها أو جفت من العين مدامعها\nأنت يا ربي مابتنسانا ياللي إتكالنا عليك\n\n+ رافعينلك يا ربي صلاه بدموعنا يا ابن الله\nارحمنا يا رب ارحمنا ملناش غيرك نترجاه\nأنت لوحدك قادر ترفع و توصلنا لبر أمان\nوسلاحنا ده صوم وصلاه"},{n:"يا رب أعمل من اجل أسمك",c:"ترانيم الاجتماع",bpm:0,t:"+ يا رب أعمل من اجل أسمك ليس لكونى بارٌ فى عينك\nلتكن عيناك مفتوحتان واذناك مصغيتان الى صوت تنهد شعبك\n\n+ ادينا يارب أنت الإيمان نشوف خلاصك على الدوام\nحتى لو كان فى أتون النار حتى لو كان فى عمق البحار\nعظيم عملك يفوق الخيال\n\n+ نترك الجرار عند الأبيار نبشر بخلاص اله جبار\nهزم الموت كسر القيود وقام من القبر بكل انتصار\n\n+ ليس لنا ليس لنا يارب نحوك عيوننا\nارحم شعبك عظم لطفك وبنعمتك سهل سبلك"},{n:"لو تركت الأرض حالاً",c:"ترانيم الاجتماع",bpm:0,t:"1- لو تركت الأرض حالاً ودعاني الإله\nكي أقدم حسابا عن وكالة الحياة\nهل بوزنتي ربحت وزنة لمجده\nهل أنا عبد أمين أحيا طوع أمره\n\n2- كيف أدخل السماء وأرى وجه أبي\nكيف أصعد إليه وآخي ليس معي\nهل سيحلو لي مقامي وأخي ملقى هناك\nخارجًا يبكي وحيدًا في الجحيم والهلاك\n\n3- يا إلهي هل حياتي تشهد بفضلك\nهل سلوكي ككلامي يعلن عن حبك\nيا إلهي ها حياتي كرسنها لك\nولأكن كما تريد مشبعًا لقلبك\n\n4- يا إلهي ليس في قوة ولا صلاح\nليس في أي شيء أنت تضمن النجاح\nقد بذرت وزرعت وأنا في الانتظار\nقد غرست وسقيت أنت تضمن الثمار"},{n:"دايمًا بتخبيني لما تهب الريح",c:"ترانيم الاجتماع",bpm:0,t:"(دايمًا بتخبيني لما تهب الريح بجناحك تداريني وعدك وعد صريح)2\n(لما الناس تنساني واشعر إني وحيد أصرخ لك في مكاني تيجي بحب أكيد)2 (وتنسيني وتعزيني)2 يا يسوع\n(لما الناس تحاربني بالإيمان بالقاك صوتك ينده إبني أجري وابات في حماك)2(وتنسيني وتعزيني)2يا يسوع\n(لما الناس بتهيني وارجع وانا مجروح بصليبك بتعيني ويشجعني الروح)2 (وتنسيني وتعزيني)2 يا يسوع"},{n:"ربي يسوع الغالي",c:"ترانيم الاجتماع",bpm:0,t:"+ ربي يسوع الغالي ما فيش زيه حبيب\nمعاه تهون الغربة ويهون حمل الصليب\n\nق: محلا العشرة وياه يسوع رب السما\nيبارك الحياه العيشة حلوة معاه\n(أنا عايش في حماه)2\n\n+ وبعز يا نفس دوسي على كل المغريات\nده حبيبي حلقه حلاوة وكله مشتهيات\n\n+ آلامي في البرية مهما كانت كتير\nعلى الأذرع الأبدية يحملني القدير\n\n+ وسعادة أبدية كما قال الكتاب\nهنا في عيشة هنية وهناك في بيت الآب"},{n:"يا رايح للسما إسمعنى",c:"ترانيم الاجتماع",bpm:0,t:"ق: يا رايح للسما إسمعنى وشوق قلبى سمعنى\nكلام يرويك ويروينى وإنت بيه تشجعنى\nعن الفادى وعن حبه وعن وعده إنه ها يجينا\nوعالسحاب يلاقينا تتحق أمانينا\n\n1- قلوبنا يارب فرحانه وأشواقنا اللى جوانا\nبننسى معاها أحزاننا وأتعابنا فى دنيانا\nومين يقدر يفرقنا عن الفادى ويفصلنا\nبيده هو ماسكنا ومضمونه سلامتنا\n\n2- ولحظة ما نرى حبيبنا فى لحظة يغير أجسادنا\nوهذا الفاسد الفانى ها يلبس مجد ربانى\nوساعتها ها يتكئنا ويتمنطق ويخدمنا\nوإحنا عند أقدامه ها نطرح كل أكاليلنا"},{n:"الله الذي لنا",c:"ترانيم الاجتماع",bpm:0,t:"(1) الله الذي لنا بل يهدينا ويحمينا لا يتركنا أبدًا عينه علينا\n\nق: ربنا لا ينسانا في طريق ذي الحياة وهو دائمًا معنا يتقدمنا\n\n(2) معنا وسط رحبنا وفي ضيقنا يبهج قلوبنا يسد كل عوزنا\n\n(3) نرفع رؤوسنا لا نهاب الخصم .. كلا أمام عدونا فمن علينا\n\n(4) فلتشدو قلوبنا لا نخاف ظل الموت بإبتهاج وهنا فالله معنا"},{n:"يا سيدي كم كان قاسي",c:"ترانيم الاجتماع",bpm:0,t:"ق: يا سيدي كم كان قاسيا موت صليب العار\nوقبل ان يحملك حملته يا بار\n\n1- سالت ماء ذقت خلا ذقت كل مرار\nسالت دماك من حشاك لتفتدي الاشرار\n\n2- فوق الصليب يا حبيبي كم لقيت الام\nممن تمادوا في ايذائك وقد غفرت اثام\n\n3- هل كل هذا يا الهي كي تعيدني\nالى حماك احيا معك وتعزيني\n\n4- يا ليت قلبي يدنو منك فافوز بك\nاحيا لاجلك امينا خاضعا لك"},{n:"ممتن لك",c:"ترانيم الاجتماع",bpm:0,t:"+ ممتن لك ومافيش كلام يوصف مشاعر الامتنان والقلب فاض وسجد أمام حبك يا أب مليان حنان\n\nالقرار - يا موسيقات الروح خديني وقدميني بتشكرات لمن فدى نفسي وسيبيني أسكب له طيب التسبيحات\n\n+ ممتن لك على الذبيح اللي اشتراني بدم الفدا ونظم بصرخاته المديح لروحي المتعبده\n\n+ ممتن لك على الأمانة اللي صنعتها مع حقارتي سترتني بنعمة ومعونة وأصلحت بالنعمة قيثارتي\n\n+ممتن لك على عمر عدى بكل خير يملى حكايات وف كل واحدة منها فيه سنده رفعتنى لك بالتعزيات\n\n+ممتن لك على المحبة اللي حضنتنى بيها ف رضاك عرفت روحي تروح بطلبة وتهيم بشوق ناحية لقاك\n\n+ ممتن لك ودموعي حمد لمعانها عرفان بالجميل تحتيها بسمة اتسعت بمجد اله حنون مالهوش مثيل"},{n:"كيف انسى سيدي الغالي",c:"ترانيم الاجتماع",bpm:0,t:"كيف انسى سيدي الغالي المسيح\nكيف آنسي دم ذي الجنب الجريح\nمن راني في هواني فآتى طوعا آلي\nمن فدانى واشتراني كاسرا قيد يدي\nكيف آنسي قلبك العافي الكبير\nمن عفي عنى وعن جرمي الخطير\nفمحى كل ذنوبي وابتدأ عهدا جديد\nوملا بالروح قلبي فغدا قلبي سعيدا\nهبني آنسي سيدي ذاتي هناك\nفعنادي قد أذاقني العناء\nأغنى في حياتي عالما آني غريب\nذاكرا انك ربى سوف تأتى عن قريب"},{n:"أنا طالب حضورك",c:"ترانيم الاجتماع",bpm:0,t:"ق: أنا طالب حضورك ولذة رضاك\nتملاني بنورك في بالقرب معاك\n\n1- أنا طالب أتغير لشخصك أتغير\nوإن كان حبي صغير لمستك ترويه\nقلبي هايستناك طلبه يكون\nمعاك حبك لا سواك هو اللي هايشفيه\n\n2- يا أبرع جمال ليك مجد وجلال\nحبك فاق الخيال عنوانه الصليب\nما لم ترى عين أو تسمع به آذان\nأو يخطر ببال حبك يا حبيب"},{n:"لا تخف لأني أنا معك",c:"ترانيم الاجتماع",bpm:0,t:"+لا تخف لأني أنا معك لا تخف أني أعينك لا تخف فإني أسمعك أنا ممسك بيمينك إلى الأبد\n\nق:جفف مدمعك من البكاء أمل مسمعك نحو السماء لا تدع عمرك يمضي هباء وليكن حبي هورجاء\n\n+لا تخف لأني أنا معك لا تخف إني لا أتتركك لا تخف إني معك لا أهملك أنا ممسك بيمينك إلى الأبد\n\n+لا تخف لأني أنا معك لا تخف فأنا حصنك لا تخف فإني ملجأك أنا ممسك بيمنك إلى الأبد\n\n+لا تخف لأني أنا معك في حزنك أمسح دمعتك لا تخف إني أريحك أنا ممسك بيمنك إلى الأبد"},{n:"ثقلت حمولي",c:"ترانيم الاجتماع",bpm:0,t:"1. ثقلت حمولي يا سيدي المسيح\nأسألك قبولي حتى استريح\n\n* من أعماق قلبي أنا أناديك\nفلك حبي يا ربى أهديك\n\n2. أجري إليك التجئ يسوع\nعلى قدميك اسكب الدموع\n\n3. لا أكف لحظة عن البكاء\nارفع صلاتي في كل مساء\n\n4. اشرق بنورك في فجر جديد\nو اغسلنى بحبك واجعلني سعيد"},{n:"يا صاحب الحنان",c:"ترانيم الاجتماع",bpm:0,t:"+ يا صاحب الحنان يا ملجأ نفسي أنت هو الضمان في وسط غربتي\nأحتاج إليك ... أحتاج إليك أحتاج منك قوة لترفعني\nأنت وحدك...أنت وحدك أنت تعين ضعفي وترحمني\nيا سيدي إني أريد العمق فيك فارويني وأحيني إني أريد نور حبك يسطع في داخلي\n\nق: يا صاحب الحنان ها صرختي إليك... إني إليك راجع راجع إليك\nراجع لحضنك راجع لدربك ... أنا راجع لنورك يا صاحب الحنان\n\n+ يا صاحب الحنان يا نبع قوتي أنت وسط الأحزان تعزي مهجتي\nأتوق إليك ... أتوق إليك أتوق أن تحيا في يا ملكي\nأنت بروحك . . . أنت بروحك أنت تقود عمري ورحلتي\nيا سيدي غير بروحك حياتي واملكن إرادتي المس فؤادي وحواسي بل وكل دنيتي"},{n:"اسمع صراخى يا سيدى",c:"ترانيم الاجتماع",bpm:0,t:"اسمع صراخى يا سيدى والى صلاتى امل اذنيك ارحنى وامسك بيدى فانا فى حاجة شديدة اليك\n\n1- ها قد اعيت فى نفسى من ضيقى ادعوا يا ربى وانت وحدك اذكرك لانك شبع قلبى\n\n2- هاقد احاط بى نهر ثم احاط بى غمر والعشب التف براسى والماء عبر الى نفسى\n\n3- جازت من فوقى التيارات و اغرقتنى الضيقات وكانك رفضتنى واشتهيت نفسى التعزيات\n\n4- بصوت الحمد اذبح لك واعود انظر هيكلك لانك استجبت لى كل ما فى يشكرك"},{n:"إني لرافع عيناي إلى السماء",c:"ترانيم الاجتماع",bpm:0,t:"إني لرافع عيناي إلى السماء ويداي ممدودتان إليك يا رب العلا\nاسمع صلاتي واستجب دعاي واستجب دعاي\nفي وقت ضيقي بحثت عن النجاة فجئت إليك قائلاً يا رب الحياة\nاسمع صلاتي واستجب دعاي واستجب دعاي\nإني لرافع عيناي إلى السماء ويداي ممدودتان إليك يا رب العلا\nاسمع صلاتي واستجب دعاي واستجب دعاي\nاتي اليك في هيكلي قدسك وأشكو خاشعا أمام عرش مجدك\nاسمع صلاتي واستجب دعاي واستجب دعاي\nربي يسوعي يا رب صخرتي عزي وترسي عليك اتكل قلبي\nاسمع صلاتي واستجب دعاي واستجب دعاي"},{n:"المؤمن الأمين",c:"ترانيم الاجتماع",bpm:0,t:"1- المؤمن الأمين يفرح فرح ثمين)2 والخاطي يظل حزين لما يسوع يجي\nلما يسوع يجي لما يسوع يجي والخاطي يظل حزين لما يجي\n\n2- يا خاطي توب وارجع ولصوت يسوع اسمع)2 تندم ولا ينفع لما يسوع يجي\nلما يسوع يجي لما يسوع يجي تندم ولا ينفع لما يجي\n\n3- يسوع قال أنا جاي والمؤمن اخده معاي)2 تعمل يا خاطي ازاي لما يسوع يجي\nلما يسوع يجي لما يسوع يجي تعمل يا خاطي ازاي لما يجي"},{n:"محتاج لايدك ياربي",c:"ترانيم الاجتماع",bpm:0,t:"محتاج لايدك ياربى تغير فيا كتير اخلق من تانى قلبى اللى عايش ضرير\nمحتاج انى اشوفك بس بعين الايمان ازرع جوايا خوفك واقلع زرع الشيطان\nمحتاج انى اكون اعمى عن الخطايا وابكي بدمع العيون واكيد هو دوايا\nمحتاج انى اشوفك بس بعين الايمان ازرع جوايا خوفك واقلع زرع الشيطان\nمحتاج انك تحطم جبال المستحيل زى ما كان جبل المقطم على الايمان دليل\nمحتاج انى اشوفك بس بعين الايمان ازرع جوايا خوفك واقلع زرع الشيطان"},{n:"أين أنت يا ربي",c:"ترانيم الاجتماع",bpm:0,t:"1- أين أنت يا ربي علمني طريقك ومهما ده كلفني مش رايح لغيرك\n\nالقرار\nأسمع أن طريقك مليان بالأشواك لكن معاك يا ربي تهون كل الألامات\n\n2- ده أنت هو الطريق والحق والحياة دربني كي أحيا فيك ودوبني في ثناياك\n\n3- لأنك غلبت العالم والشيطان والخطية أين أنت يا ربي هبني تلك العطية"},{n:"غيرت اغسطين",c:"ترانيم الاجتماع",bpm:0,t:"غيرت اغسطين الفاجر حولته إلى قديس طاهر حولت ماريا القبطية من سيرتها الشيطانية\nإلى سيرة حلوة ملائكية في عيشة نسك سماوية غيرت اغسطين الفاجر حولته إلى قديس طاهر\n\nحولت كمان موسى الأسود إلى كانت هيئته ترعد إلى قديس طيب متواضع قلبه ابيض نوره ساطع\nصاحب قدرة لانهائية بتحب خلاص البشرية حولت كمان موسى الأسود اللي كانت هيئته ترعد\n\nيا ربى ياللى أتوليتهم بالنعمة وبدلت حياته هم وكثير تانى غيرهم تحريرهم تم وتبريرهم\nأرجوك أرجوك اتولانى حولني إلى إنسان تانى يا ربى ياللى أتوليتهم بالنعمة وبدلت حياتهم\n\nسامحني وبالعطف اشملني ولصورة بهية حولني لإنسان أتحرر من شره ومشي بهمة في طريق بره\nطرح الماضي بكل سواده في درب النور ماشي جهاده سامحني وبالعطف اشملني ولصورة بهية حولني"},{n:"إفرحي يا نفسي وغني",c:"ترانيم الاجتماع",bpm:0,t:"1- إفرحي يا نفسي وغني لعريسك الحبيب إللي أعطاكي الحرية وفداكي على الصليب\nافرحي يا نفسي وغني مجدي اسم المسيح نلتي أعظم ما تتمني أذكري الجنب الجريح\n\n2- افرحي يا نفسي وغني مجدي اسم الإله اسهري دوماً وجاهدي واستعيني بالصلاة\nقومي ونادي بأعلى صوتك للخطاة للمساكين عرفيهم بفاديكي المخلص الأمين\n\n3- افرحي يا نفسي وغني وامسحي كل الدموع اظهري نورك وملحك خبري بخلاص يسوع\nكرسي كل حياتك للمسيحك القدوس واجعلي غاية إيمانك هو خلاص النفوس"},{n:"سنين طويلة مضت",c:"ترانيم الاجتماع",bpm:0,t:"1- سنين طويلة مضت والرب معتنى بي وكل يوم محمول على الأذرع الأبدية) 2\n(ويسوع بيده ماسكنى في مراع الخضر رابضني) 2\n\n2- ملك الملوك يا يسوع يا سيد الاسياد نفوسنا في انتظار تأخدنا للأمجاد) 2\n(واتملى فيك بعينى يا يسوع يا غالي على) 2\n\n3- يسوع سباني بحبه والقلب به فرحان وعد يجينا من مجده وتنتهي الأحزان) 2\n(تبقى السما كلها لى أعظم ما فيها مسيا) 2"},{n:"هارمي كل اتكالي",c:"ترانيم الاجتماع",bpm:0,t:"هارمي كل اتكالي عليك و علي كلامك هارمي الشبكه\nكل حياتي ملك ايديك ايد مين غيرك تدي البركه\n\nانا سلمتك كل حياتي و بقول دايما تبقي مشيئتك\nاصل انا حتي بقلبي الخاطي جربت حنانك و عرفتك\n\nكلي يقين ان انت معايا واثق فيللي بتختاره ليا\nمانت في ضعفي بتبقي حمايه و طريق الخير ترسمه ليه\n\nقلبي بيصرخلك و ينادي انك تقبل تدخل بيتي\nوان كنت انا بعتك في الماضي بارك انت العمر الاتي"},{n:"انت تهتم بى",c:"ترانيم الاجتماع",bpm:0,t:"( انت تهتم بى أنت تقودنى\nوأنت ترعانى\nهاقلبى فى يديك وعينى عليك\nيا من لا تنسانى )2\n( أسبحك.... بقلب أشتهى.... دومًا حضورك....\nوأعبدك.... ربى للمنتهى.... طلبتى مجدك.... )2\n(يا من أحيا به أوجد من أجله\nولقصده آتانى\nسلمت دفتى فقود سفينتى\nأثق بك ايمانى )2\n( أسبحك.... بقلب أشتهى.... دومًا حضورك....\nوأعبدك.... ربى للمنتهى.... طلبتى مجدك.... )2\n(أذنى ثقبتها ولعًا بحبك\nفشخصك سبانى\nحبك أسكرنى عطفك غمرنى\nودمك فدانى )2\n( أسبحك.... بقلب أشتهى.... دومًا حضورك....\nوأعبدك.... ربى للمنتهى.... طلبتى مجدك.... )2\n(أطيعك سيدى بكل ما لدى\nوأسمك ضمانى\nفحياتى كلها أنت تتويجها\nوأنت سلطانى )2"},{n:"أيها الفخاري الأعظم",c:"ترانيم الاجتماع",bpm:0,t:"( أيها الفخاري الأعظم أنا كالخزف بين يديك\nعد وإصنعني وعاءً آخر مثلما يحسن في عينيك )2\n\n( أخضع ذاتي دون عناد لإصابعك تشكل فيَ\nلن أتوجع لن أتراجع فأنا إشتقت لعملك فيَ )2\n\n( آتي إليك بكل فسادي ثقتي في نعمتك ويديك\nلا لليأس ولا للماضي قلبي إتجه الآن إليك )2"},{n:"بشوق وحنين وصبر سنين",c:"ترانيم الاجتماع",bpm:0,t:"1- (بشوق وحنين وصبر سنين بكل يقين وايمان للسما شاخصين ومنتظرين نشوفك بالعيان)*2\n\nالقرار- (وتناهى الليل تناهى وتقارب النهار وعريسنا جاي ياخدنا نستوطن الديار)*2\n\n2- (يا غربة خلاص دارت الأيام النهاردة مش هيعود بانت العلامات هانت الصعوبات ما أحلى اليوم\nالموعود)*2\n\n3- (نصعد بهتاف وبصوت البوق مسيحنا ينادينا نغني على طول نهتف ونقول مجدا لك يا فادينا)*2"},{n:"أحبك معنى كل وجود",c:"ترانيم الاجتماع",bpm:0,t:"1 - أحبك معنى كل وجود أحبك والكلام محدود وحبك عدى كل سدود حبيبي يا يسوع البار\n\n2 - أحبك تنتهي الآلامات أحبك تبتدي النغمات وحبك حب للنهايات حبيبي يا يسوع البار\n\n3 - أحبك ربي للإنسان أحبك راحة للحيران وحبك راية الإيمان حبيبي يا يسوع البار\n\n4 - أحبك فوق صليب العار أحبك بين لهيب النار وحبك حب م الأسرار حبيبى يا يسوع البار\n\n5 - أحبك القساوة تذوب أحبك ترفع المغلوب وحبك خلى قلبي يتوب حبيبي يا يسوع البار\n\n6 - أحبك أنت أوفى صديق أحبك حتى لو ف الضيق وحبك لَّي أعظم شيء حبيبي يا يسوع البار"},{n:"قلبه حنين",c:"ترانيم الاجتماع",bpm:0,t:"1- (قلبه حنين حبه يبين إن صليبه ده كان تكفير عن خطايانا\nمات وفدانا نعمة غنية وحب كبير)*2\n\nالقرار (سر حياتنا ده هو يسوع بنرددها بصوت مسموع)*2\n(هو الكلمة وهو الله هو بروحه عطانا حياه)*2\n\n2- (نادي علينا وبقى لينا مينا ومرسى وشط وفلك نجاة\nصرنا سفينة في يد أمينة تعلى الموجة ونعلى معاه)*2\n\n3- (عين تحرسنا وايد تواسينا وهيعدينا لحد سماه\nمهما الغربة تبان لنا صعبة هترسي المركب وهنلقاه)*2"},{n:"صورتي عندك صورة جميلة",c:"ترانيم الاجتماع",bpm:0,t:"1- صورتي عندك صورة جميلة رغم آني خاطىء عنيد\nصورة قداسة صورة طهارة رسمتها لي بأحلى أيد\nصورة في فكرك مش في الحقيقة كانت حقيقة في يوم عمادي\nيوم بعد يوم كترت همومي زادت ذنوبي شوهت لي الصورة\n\nرجعني تاني لشكلي الأولاني ألبسني تاني حلتي الأولى\nخليني شبهك على صورتك ورسمك رجعني تاني للمسيح أيقونة\n\n2- حرت في حياتي وماشي أدور من كل إنسان على فضيلة\nلا عارف أبقى زي غيري ولا عارف أعمل من نفسي قيمة\nوناسي أدور على صورتي عندك اكشف جمالها فيها جهادي\nأعمال عظيمة من وقت أزلي أعددتها لي مرسومة في الصورة\n\n3- صورتي عندك مرسومة بدقة من وقت أزلي قبل ميلادي\nفيها كل تفاصيل حياتي من يوم ميلادي حتى مماتي\nأعددت لي غلبة على الخطية على كل سقطة ما انت قارب نجاتي\nأقدر أحارب كل التجارب بسيف إيماني مرسوم لي في الصورة\n\n4- ياللي بتقبل كاس ميه بارد فلسين.. خمس خبزات.. سمكتين\nرطل ناردين من مرأة خاطية خد من أيدي .. ليك عندي دين\nأقبل حياتي .. قلة قدراتي ضعف مواهبي ده أنا صفر اليدين\nبس بحبك من كل قلبي ده أنت الهي ما ليش سيدين"},{n:"سود يا يسوع فى حياتي",c:"ترانيم الاجتماع",bpm:0,t:"1- سود يا يسوع فى حياتي نفسى معاك مرتاحة\nفيك بلاقى نجاتى وفى قربك ألاقى الراحة\n\nالقرار :- إنت مالك عمرى إنت سيد قلبى\nإنت وحدك ربى وكل حبى إليك\n\n2- ليك بأقدم عمرى بأهدى إليك أيامى\nوحدك مالك أمرى وإنت سر سلامى"},{n:"حاجتي دومًا إليك",c:"ترانيم الاجتماع",bpm:0,t:"1- حاجتي دومًا إليك راحتي في راحتيك كل أمري في يديك.\n\nق: حبيبي يا يسوع حبيبي يا يسوع طبيبي يا يسوع نصيبي يا يسوع وحدك ملء الضلوع.\n\n2- حبك ربي كثير والدم الجاري غزير صفحك عني كبير حبيبي يا يسوع.\n\n3- أنت سيدي حبيبي أنت لي خير نصيب أنت آتٍ عن قريب."},{n:"أمين تعال أيها الرب يسوع",c:"ترانيم الاجتماع",bpm:0,t:"1. أمين تعال أيها الرب يسوع أمين تعال قلوبنا اشتاقت للربوع\nمنتظرينك حسب وعودك ( قلت سآتى سريعاً أمين )2\n\n2. نراك بمجدك على السحاب المنير تجعلنا مثلك وف طرفه عين إليك نطير\n\n3. نفرح بقربك ونشوف آثار الجروح علامة حبك لنا يا حبيب الروح\n\n4. نسعد بشخصك ونكون معاك كل حين يجمعنا عرسك مع جماعة المفديين\n\n5. ننسى أتعابنا ولا يكون هناك أنين حوالين عريسنا دوماً نكون فرحانين\n\n6. أشواق قلوبنا نلقاها ونشوفك بالعين يا فادى نفوسنا يا حلو يا طيب يا أمين"},{n:"هيستجيب وعمره مايسيبك",c:"ترانيم الاجتماع",bpm:0,t:"هيستجيب وعمره مايسيبك ويغيب\nاصبر وهيفرح قلبك أملك في ربنا مش هيخيب\nوبالصلاة هيوهبك في الضيقة نجاة\nهو الللي جنبك طول عمرك (ولما بتعوزه هتلقاه)2\n\n(اطمن كله هيبقى تمام وهيبعتلك في الشدة سلام\nربنا هيعوض أيامك ويحققلك كل الأحلام)2\n\nهيستجيب وليك معاه خطة وترتيب\nمشيئته خير وهيثبتلك لأنه رب عظيم وعجيب\nوفي الضيقات هيعدي بيك كل الأزمات\nهيحول الحزن لفرحة (ده يسوع اله المستحيلات)2"},{n:"وفيما اظنه لا يسنجيب",c:"ترانيم الاجتماع",bpm:0,t:"وفيما أظنه لا يستجيب يرتب أمرا عجيب رهيب\nيحل قيودي ويطفي اللهيب بيده فيصنع عهدا جديد\nيظل أمينا وديعا قريب فيخجل قلبي بحبه العجيب\nوحين يطول الليل الرهيب أراه يضئ أمامي الطريق\nويفتح أمامي بابا جديد فكيف أظنه لا يستجيب فكيف أظنه لا يستجيب (القرار)\n\n1- يزلزل أسوار سجني العتيد ويعطي لنفسي سلاما عجيب\nويسكب زيتا وماءا وخمرا يضمد جرحي إلى أن يطيب\nرأيته ينظر من فوق الصليب ويرقب رجوعي له من بعيد\nودمه كنبع شفاءا وحبا حياة وبرا لمن يريد\n\nفكيف أظنه لا يستجيب فكيف أظنه لا يستجيب\n\n2- يطمئن خوفي ينير السبيل له سلطانا على المستحيل\nيكفف دمعي ويرفع حملي علي كتفيه بطول المسير\nنظرت إليه بعين العبيد فمال إلي كأب رحيم\nيهرع لعوني ويعرف وجعي ويدعوني ابنا بين البنين\nفكيف أظنه لا يستجيب فكيف أظنه لا يستجيب"},{n:"وقت الصلاة",c:"ترانيم الاجتماع",bpm:0,t:"وقت الصلاة افرد جناحك للسما\nوسيب دموعك تشتكي ربك تملي بيسمعك\nهتلاقي راحه ونور بينهي عتمتك وصوت بيهمس لك ويقول\nطول ما انت جنبي مفيش ولا شيء هيقدر يوجعك\n\nبالصلاه ف حاجات كتيره اتغيرت واقروا التاريخ\nكم قصه شاهده عاللي عدا واللي كان\nكل اللي عاشوا ف التجارب والالم داقوا الفرح\nوالكتاب مليان قصص كتير اوي عبر الزمان\n\nالفكره انك مش لوحدك ولا منسي ف الحياه\nمعاك الهك ماشي معاك طول الطريق\nارفع له قلبك قوله محتاج تعويضات محتاح حياه\nبايديه يطبطب فجأه تلقي الصعب زال وانتهي\n\nوانا حد عاين ف حياته مجده وشوفت ايديه\nوهي سانده ضعفي فى وقت الخطر\nورغم بعدي وقسوتي لما ناديته لقيته جاي\nبيقولي افرح كل هم وحمل من قلبك عبر"},{n:"اصليله",c:"ترانيم الاجتماع",bpm:0,t:"(اصليله تحير عقلى تدابيره بيقفل باب ويفتح الف باب غيره)2\nيادوب يلمح إيديا امامه مرفوعه بحب عجيب عليا يفيض جزيل خيره\n\nمبفهمهوش ساعات يمكن وبتذمر واشوفه بعيد فى وقت الضيق ومتأخر\nيقولى اصبر متستعجلش على فرحك انا بأيدى بجهزلك فرح اكبر\n\n(بيبعت رحمه للسهران فى ليل قاسى ويبعت نعمة للغفلان وللناسى)2\nوبيطبطب على المهموم وبيواسى ويفتح طاقة للمسجون فى احزانه\n\nحنين واللى داق منه اكيد عارفه يحوط ع اللى ماشى فى سكته وشايفه\nويصبر ع اللى ماشى بعيد وبيخالفه ويوفى العهد لو كل البشر خانوا\n\n(أروح عنده احط الحمل واسيبه وانام مرتاح مانا واثق فى ترتيبه)2\nولا يشغلنى خوف من جاى وليه وازاى بقول الخير يارب انت اللى هتجيبه\n\nسخيه ايديه وجوة عنيه انا متشال وفى حضوره بحس بكل راحة بال\nده قال ف وعوده هيعوضنى عن اتعاب سنين عدت وبكرة هيبقى احسن حال\n\n(بيبعت رحمه للسهران فى ليل قاسى ويبعت نعمة للغفلان وللناسى)2\nوبيطبطب على المهموم وبيواسى ويفتح طاقة للمسجون فى احزانه\n\nحنين واللى داق منه اكيد عارفه يحوط ع اللى ماشى فى سكته وشايفه\nويصبر ع اللى ماشى بعيد وبيخالفه ويوفى العهد لو كل البشر خانوا"},{n:"متشغلش بالك",c:"ترانيم الاجتماع",bpm:0,t:"متشغلش بالك خايف ليه وتخاف من ايه ربنا موجود\nسلم احوالك كلها ليه واطلب ربنا تلاقيه موجود\nالجئ فى المحنة لرب الكون دايما قوله كيرياليسون\nكيرياليسون يارب ارحم يارب ارحم من غيرك بس علينا رحوم (القرار)\n\n1- وقت الآزمات والضيق والكرب او لما تزيد اهوال الحرب\nاطلب ربك واصرخ من القلب اندهله وقوله ارحمنا يارب\nارحمنا يالليى خلقت الكون كيرياليسون\n\n2- لو شفت الأخ بيتقل اخوه والابن بيقسى على امه وابوه\nولقيت الناس ناسين الله مشغولة بمال زايل\nانده ربك حملك هيهون كيرياليسون"},{n:"ستر العلي",c:"ترانيم الاجتماع",bpm:0,t:"ستر العلي ده عنواني وفي ضِلهُّ بابات، سِتره مكاني\nستر العلي ده عنواني وفي ضله بابات، طب إيه تاني هاينقصني\nربي ده ملجأي وحِصني رامي اتكالي على العالي\nياما فخاخ جيه ونصبهالي كام صَّياد، ولقيت الله جيه نَّجاني (القرار)\n\n1- م الوبا هَّو ينجيك تحت جناحه هايحميك\nم الوبا هَّو ينجيك تحت جناحه هايحميك\nمن خوف الليل ما تخافشي وسهم يطير مايجيش جنبيك\n\n2- هايوصِّي ملايكته بيك يفضلوا دايمًا حواليك\nهايوصِّي ملايكته بيك يفضلوا دايمًا حواليك\nعلى إيدهم يشيلوك ما تقعشي وتخبط في حجر رِجليك\n\n3- لما هاتتعلق بيه هو ينجيك بإيديه\nلما هاتتعلق بيه هو ينجيك بإيديه\nوهايِستجيب لما هتِدعيه فناديه في الضيق تلاقيه"},{n:"كلمة في ودنك انت يا خادم",c:"ترانيم الاجتماع",bpm:0,t:"القرار: (كلمة فى ودنك أنت ياخادم ياللى بقيت ضمن الخدام\nتعرف أيه عن معنى الخدمة ؟ ولا الخدمة دى بس كلام )2\n\n1- ( معنى الخدمة تنكر ذاتك علشان الله يظهر قدام\nولا مصٌر إنك تظهر وتخفى يسوع وأنت تبان\nقبل ما تخدم غيرك لازم تخدم نفسك أنت تمام )2\n\n2- ( مش مطلوب تخرج شياطين ولا مفسٌر للأحلام\nلكن تبقى أنجيل مفتوح ومكان ما تحل يحل سلام\nقبل ما تخدم غيرك لازم تخدم نفسك أنت تمام )2\n\n3- $('#shx').onclick=showClose;$('#shn').onclick=()=>showGo(1);$('#shp').onclick=()=>showGo(-1);$('#sho').onclick=()=>{const a=$('#sha');if(a.style.display==='none'){a.style.display='block';if(!a.dataset.m){a.dataset.m=1;AUD.mount(a,SH.title)}}else a.style.display='none';showFit()};$('#shf').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():o.requestFullscreen()}catch(e){}};

const SV=[['cls','🏫','فصولي'],['addc','🧑‍🏫','إضافة فصل جديد'],['list','👧','القائمة'],['newk','👦','مخدوم جديد'],['att','✅','الحضور'],['fu','🌿','الافتقاد'],['reqs','📥','طلبات الانضمام للفصل'],['join','➕','طلب انضمام لفصل'],['bd','🎂','أعياد الميلاد']];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function svSel(){const c=L('cls',[]);if(!c.length)return '<p class="note">ضيف فصل الأول من "إضافة فصل جديد"</p>';if(!st.cl||!c.find(x=>x.id===st.cl))st.cl=c[0].id;return `<select onchange="st.cl=this.value;render()">${c.map(x=>`<option value="${x.id}" ${x.id===st.cl?'selected':''}>${esc(x.n)}</option>`).join('')}</select>`}
function serv(){
 const v=st.sv;
 if(!v){const k=L('kids',[]),c=L('cls',[]);$('#m').innerHTML=`<div class="card hero"><small>خدمتي</small><h2>${AR(c.length)} فصول · ${AR(k.length)} مخدوم</h2></div><div class="grid">${SV.map(x=>`<button class="tile" onclick="st.sv='${x[0]}';render()"><i style="font-size:44px">${x[1]}</i>${x[2]}</button>`).join('')}</div><div class="card"><h3>📥 استيراد من ملف</h3><input type="file" accept=".json,.csv,.txt,application/json,text/csv,text/plain" onchange="pickFile(this)"><textarea id="pt" rows="3" placeholder="أو الصق البيانات هنا"></textarea><button class="btn s" onclick="importText($('#pt').value)">استيراد</button><p class="note">البيانات بتتحفظ على موبايلك بس.</p></div>`;return}
 const T=SV.find(x=>x[0]===v)[2];const kids=L('kids',[]),cls=L('cls',[]);let b='';
 if(v==='cls')b=cls.map(c=>`<div class="item row"><span class="f"><b>${esc(c.n)}</b><small>${AR(kids.filter(k=>k.cls===c.id).length)} مخدوم</small></span><button class="btn s" onclick="st.cl='${c.id}';st.sv='list';render()">القائمة</button><button class="btn s g" onclick="delC('${c.id}')">حذف</button></div>`).join('')||'<p class="note">مفيش فصول لسه</p>';
 if(v==='addc')b=`<input id="cn" placeholder="اسم الفصل (مثال: ثانية ابتدائي)"><button class="btn" onclick="const n=$('#cn').value.trim();if(n){const c=L('cls',[]);c.push({id:uid(),n});S('cls',c);st.sv='cls';render()}">حفظ الفصل</button>`;
 if(v==='newk')b=cls.length?`<input id="kn" placeholder="اسم المخدوم"><input id="kp" type="tel" placeholder="رقم الموبايل (اختياري)"><input id="kq" type="tel" placeholder="رقم ولي الأمر"><input id="kf" placeholder="أب الاعتراف"><input id="kb" type="date"><small>تاريخ الميلاد</small>${svSel()}<button class="btn" onclick="const n=$('#kn').value.trim();if(!n)return;const k=L('kids',[]);k.push({id:uid(),n,ph:$('#kp').value.trim(),pph:$('#kq').value.trim(),conf:$('#kf').value.trim(),pts:0,bd:$('#kb').value,cls:st.cl});S('kids',k);st.sv='list';render()">حفظ المخدوم</button>`:'<p class="note">ضيف فصل الأول</p>';
 if(v==='list'){b=svSel()+kids.filter(k=>k.cls===st.cl).map(k=>`<div class="item"><div class="row"><span class="f"><b>${esc(k.n)}</b><small>${k.ph?'📞 '+esc(k.ph):''} ${k.pph?'👪 '+esc(k.pph):''} ${k.bd?'🎂 '+k.bd:''}</small>${k.conf?`<small>أب الاعتراف: ${esc(k.conf)}</small>`:''}</span>${k.ph?`<a class="btn s" style="text-decoration:none" href="tel:${esc(k.ph)}">اتصل</a>`:''}</div><div class="row" style="margin-top:6px"><span class="tag">⭐ ${AR(k.pts||0)} نقطة</span><button class="btn s" onclick="pt('${k.id}',5)">+٥</button><button class="btn s" onclick="pt('${k.id}',-5)">-٥</button><span class="f"></span><button class="btn s g" onclick="delK('${k.id}')">حذف</button></div></div>`).join('')}
 if(v==='att'){const t=today(),A=(L('att2',{})[t]||{});b=svSel()+`<small>${t}</small>`+kids.filter(k=>k.cls===st.cl).map(k=>`<div class="item row"><span class="f">${esc(k.n)}</span><button class="btn s ${A[k.id]?'':'g'}" onclick="tgA('${k.id}')">${A[k.id]?'حاضر':'غايب'}</button></div>`).join('')||'';}
 if(v==='fu'){const t=today(),A=(L('att2',{})[t]||{}),F=L('fu',{});b=svSel()+'<p class="note">الغايبين النهاردة</p>'+kids.filter(k=>k.cls===st.cl&&!A[k.id]).map(k=>`<div class="item"><div class="row"><span class="f"><b>${esc(k.n)}</b></span>${k.ph?`<a class="btn s" style="text-decoration:none" href="tel:${esc(k.ph)}">اتصل</a>`:''}</div>${(F[k.id]||[]).slice(0,2).map(n=>`<small>${n[0]}: ${esc(n[1])}</small>`).join('')}<input id="n_${k.id}" placeholder="ملاحظة افتقاد"><button class="btn s" onclick="addF('${k.id}')">حفظ الملاحظة</button></div>`).join('')}
 if(v==='reqs'){const r=L('reqs',[]);b=r.filter(x=>x.st==='p').map(x=>`<div class="item"><b>${esc(x.n)}</b><small>طالب الانضمام لفصل: ${esc((cls.find(c=>c.id===x.cls)||{n:'؟'}).n)}</small><div class="row"><button class="btn s" onclick="rq('${x.id}',1)">قبول</button><button class="btn s g" onclick="rq('${x.id}',0)">رفض</button></div></div>`).join('')||'<p class="note">مفيش طلبات</p>'}
 if(v==='join')b=cls.length?`<input id="jn" placeholder="اسمك"><input id="jp" type="tel" placeholder="موبايلك">${svSel()}<button class="btn" onclick="const n=$('#jn').value.trim();if(!n)return;const r=L('reqs',[]);r.push({id:uid(),n,cls:st.cl,ph:$('#jp').value,st:'p'});S('reqs',r);st.sv=null;render()">إرسال الطلب</button><p class="note">في النموذج الطلب بيوصل لنفس الموبايل. الربط بين الخدام محتاج سيرفر.</p>`:'<p class="note">ضيف فصل الأول</p>';
 if(v==='bd'){const n=new Date(),m=kids.filter(k=>k.bd).map(k=>{const d=new Date(k.bd);let nx=new Date(n.getFullYear(),d.getMonth(),d.getDate());if(nx<new Date(n.getFullYear(),n.getMonth(),n.getDate()))nx=new Date(n.getFullYear()+1,d.getMonth(),d.getDate());return {k,days:Math.round((nx-n)/864e5)+1}}).sort((a,b)=>a.days-b.days);b=m.map(x=>`<div class="item row"><span class="f">${esc(x.k.n)}</span><span class="tag">${x.days<=1?'النهاردة':'بعد '+AR(x.days)+' يوم'}</span></div>`).join('')||'<p class="note">ضيف تواريخ ميلاد المخدومين</p>'}
 $('#m').innerHTML=`<div class="row"><button class="btn s" onclick="st.sv=null;render()">رجوع</button><h3 class="f">${T}</h3></div>`+b}

function importText(t){let d;t=t.trim();try{d=JSON.parse(t)}catch(e){d=null}
 if(!d){const rows=t.split(/\r?\n/).filter(x=>x.trim()).map(r=>{const o=[];let c='',q=false;for(const ch of r){if(ch==='"')q=!q;else if((ch===','||ch==='\t'||ch===';')&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())});const h=rows.shift()||[];const ix=w=>h.findIndex(x=>x.includes(w));const g=(r,w)=>{const i=ix(w);return i<0?'':(r[i]||'')};d={cls:'فصلي',kids:rows.map(r=>{const dd=+g(r,'اليوم'),mm=+g(r,'الشهر'),yy=+g(r,'السنة');return {n:g(r,'الاسم'),ph:g(r,'التليون').replace(/^(\+20|0)$/,''),pph:g(r,'ولي').replace(/^(\+20|0)$/,''),bd:(yy>1900&&mm>=1&&mm<=12&&dd>=1)?yy+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0'):'',conf:g(r,'الاعتراف'),pts:+g(r,'نقاط')||0}}).filter(k=>k.n)}}
 if(Array.isArray(d))d={cls:'فصلي',kids:d};
 if(!d.kids||!d.kids.length){alert('مفيش مخدومين في الملف');return}
 const cl=L('cls',[]),kd=L('kids',[]);let c=cl.find(x=>x.n===d.cls);if(!c){c={id:uid(),n:d.cls||'فصلي'};cl.push(c)}let n=0;d.kids.forEach(k=>{if(!kd.find(x=>x.n===k.n&&x.ph===k.ph)){kd.push({...k,id:uid(),cls:c.id});n++}});S('cls',cl);S('kids',kd);alert('تم استيراد '+n+' مخدوم');st.cl=c.id;st.sv='list';render()}
function pickFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(f,'utf-8')}
function delC(id){if(!confirm('حذف الفصل وكل مخدوميه؟'))return;S('cls',L('cls',[]).filter(c=>c.id!==id));S('kids',L('kids',[]).filter(k=>k.cls!==id));render()}
function pt(id,n){const k=L('kids',[]);const x=k.find(y=>y.id===id);x.pts=Math.max(0,(x.pts||0)+n);S('kids',k);render()}
function delK(id){S('kids',L('kids',[]).filter(k=>k.id!==id));render()}
function tgA(id){const a=L('att2',{});const t=today();a[t]=a[t]||{};a[t][id]=!a[t][id];S('att2',a);render()}
function addF(id){const v=$('#n_'+id).value.trim();if(!v)return;const f=L('fu',{});f[id]=f[id]||[];f[id].unshift([today(),v]);S('fu',f);render()}
function rq(id,ok){const r=L('reqs',[]);const x=r.find(y=>y.id===id);if(ok){const k=L('kids',[]);k.push({id:uid(),n:x.n,ph:x.ph||'',bd:'',cls:x.cls});S('kids',k)}x.st=ok?'a':'r';S('reqs',r);render()}
function doImport(){try{const h=location.hash;if(!h.startsWith('#imp='))return;const d=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(h.slice(5))))));const cl=L('cls',[]);const kd=L('kids',[]);let c=cl.find(x=>x.n===d.cls);if(!c){c={id:uid(),n:d.cls};cl.push(c)}let n=0;d.kids.forEach(k=>{if(!kd.find(x=>x.n===k.n&&x.ph===k.ph)){kd.push({id:uid(),cls:c.id,...k});n++}});S('cls',cl);S('kids',kd);history.replaceState(null,'',location.pathname+location.search);alert('تم استيراد '+n+' مخدوم على موبايلك فقط');}catch(e){}}
doImport();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script><script src="bible.js?v=1"></script><script src="pc1.js"></script><script src="pc2.js"></script><script src="ppfix.js"></script><script src="audio.js"></script><script>(function(){if(window.__upd)return;window.__upd=1;var b=document.createElement('button');b.id='updbtn';b.textContent='🔄 اضغط للتحديث';b.setAttribute('style','position:fixed;bottom:12px;left:12px;z-index:99999;background:#f4c430;color:#222;border:2px solid #b8860b;border-radius:22px;padding:8px 14px;font:bold 15px sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3)');b.onclick=async function(){b.textContent='جاري التحديث...';try{var rs=await navigator.serviceWorker.getRegistrations();for(var r of rs)await r.unregister();var ks=await caches.keys();for(var k of ks)await caches.delete(k)}catch(e){}location.reload()};document.body.appendChild(b);if('serviceWorker' in navigator){var had=!!navigator.serviceWorker.controller;navigator.serviceWorker.getRegistration().then(function(r){r&&r.update()}).catch(function(){});navigator.serviceWorker.addEventListener('controllerchange',function(){if(had&&!window.__r){window.__r=1;location.reload()}})}})();</script></body></html>
